name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devkit:
    name: Build DevKit userspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio gcc make
      - name: Build aegisctl + init
        run: |
          cd devkit
          make -j"$(nproc)" initramfs
      - name: Verify aegisctl binary
        run: |
          file devkit/build/aegisctl
          devkit/build/aegisctl help

  module-check:
    name: AEGIS module in-tree build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex gcc libelf-dev libssl-dev make
      - name: Fetch upstream kernel at base commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/torvalds/linux.git linux
          cd linux
          git fetch --depth 1 origin ${{ vars.AEGIS_BASE || '4d7d9486c04d917265f64c55bd23b2cc4fe7749c' }}
          git checkout -f FETCH_HEAD
      - name: Install AEGIS module + apply patches
        run: |
          cd linux
          cp -r ../aegis security/aegis
          git apply ../patches/*.patch
      - name: Configure
        run: |
          cd linux
          cp ../build/aegis.config .config
          make olddefconfig
      - name: Prepare build tree
        run: |
          cd linux
          make -j"$(nproc)" prepare
      - name: Compile the AEGIS module
        run: |
          cd linux
          make -j"$(nproc)" security/aegis/
          test -f security/aegis/built-in.a
          grep -q "CONFIG_SECURITY_AEGIS=y" .config && echo "CONFIG_SECURITY_AEGIS=y"

  boot-test:
    name: QEMU boot test (AEGIS active end-to-end)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex gcc libelf-dev libssl-dev make cpio qemu-system-x86 busybox-static
      - name: Fetch upstream kernel at base commit
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/torvalds/linux.git linux
          cd linux
          git fetch --depth 1 origin ${{ vars.AEGIS_BASE || '4d7d9486c04d917265f64c55bd23b2cc4fe7749c' }}
          git checkout -f FETCH_HEAD
      - name: Install AEGIS module + apply patches
        run: |
          cd linux
          cp -r ../aegis security/aegis
          git apply ../patches/*.patch
      - name: Configure
        run: |
          cd linux
          cp ../build/aegis.config .config
          make olddefconfig
      - name: Build kernel
        run: |
          cd linux
          make -j"$(nproc)"
          test -f arch/x86/boot/bzImage
      - name: Build initramfs
        run: |
          cd devkit
          make initramfs
      - name: Boot in QEMU and verify AEGIS is active
        run: |
          cd devkit
          timeout 180 qemu-system-x86_64 -m 1024 -smp 2 \
            -kernel ../linux/arch/x86/boot/bzImage \
            -initrd initramfs.cpio.gz \
            -append "console=ttyS0 panic=-1" \
            -nographic -no-reboot > boot.log 2>&1 || true
          grep -aq "AEGIS is ACTIVE - Shield is UP" boot.log
          grep -aq "Securityfs interface created" boot.log
          grep -aq "Status:.*ACTIVE" boot.log
          echo "BOOT TEST PASSED — AEGIS initialized, securityfs live, status readable from userspace"
      - name: Enforcement test (protect file, deny write, unprotect)
        run: |
          cd devkit
          ( \
            sleep 12; \
            echo "aegisctl file-add /etc/passwd"; sleep 1.5; \
            echo "echo hacked > /etc/passwd"; sleep 1.5; \
            echo "head -1 /etc/passwd"; sleep 1.5; \
            echo "aegisctl file-del /etc/passwd"; sleep 1.5; \
            echo "echo hacked > /etc/passwd"; sleep 1.5; \
            echo "aegisctl proc-add cid testdaemon"; sleep 1.5; \
            echo "poweroff -f"; sleep 3 \
          ) | timeout 90 qemu-system-x86_64 -m 1024 -smp 2 \
            -kernel ../linux/arch/x86/boot/bzImage \
            -initrd initramfs.cpio.gz \
            -append "console=ttyS0 panic=-1" \
            -nographic -no-reboot > enforce.log 2>&1 || true
          grep -aq "protected_files_add <- /etc/passwd" enforce.log
          grep -aq "can't create /etc/passwd: Permission denied" enforce.log
          grep -aq "root:x:0:0" enforce.log
          grep -aq "protected_files_del <- /etc/passwd" enforce.log
          grep -aq "protected_procs_add <- testdaemon" enforce.log
          echo "ENFORCEMENT TEST PASSED — kernel denied the write, policy add/remove from userspace works"
      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-logs
          path: |
            devkit/boot.log
            devkit/enforce.log