name: signal-monitor

on:
  schedule:
    - cron: "42 7 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather fork/star/HN signals
        id: sig
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          forks=$(gh api "repos/$repo/forks" --paginate --jq '.[].full_name' | wc -l)
          stars=$(gh api "repos/$repo" --jq '.stargazers_count')
          hn=$(curl -s "https://hn.algolia.com/api/v1/search?query=${{ github.event.repository.name }}&tags=story" \
            | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('nbHits',0))")
          date=$(date -u +%Y-%m-%d)
          body=$(printf '## Signal report — %s\n\n- Stars: **%s**\n- Forks: **%s**\n- HN mentions (stories): **%s**\n\n_auto-generated by signal-monitor workflow_' \
            "$date" "$stars" "$forks" "$hn")
          echo "last_issue=$(gh api "repos/$repo/issues?state=open&creator=app/github-actions&labels=signal" --jq '.[0].number' 2>/dev/null || echo "")" >> "$GITHUB_ENV"
          echo "$body" > /tmp/body.md
      - name: Post or update report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$last_issue" ]; then
            gh issue edit "$last_issue" --body-file /tmp/body.md >/dev/null
          else
            gh issue create --title "signal report" --body-file /tmp/body.md --label signal 2>/dev/null || \
            gh issue create --title "signal report" --body-file /tmp/body.md
          fi